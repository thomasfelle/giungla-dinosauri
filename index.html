{const c=document.createElement("canvas");c.width=4;c.height=256;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,0,256);
 g.addColorStop(0,"#2c6fc2");g.addColorStop(.35,"#6aa8e0");g.addColorStop(.5,"#c9e3d8");g.addColorStop(1,"#c9e3d8");x.fillStyle=g;x.fillRect(0,0,4,256);
 const dome=new THREE.Mesh(new THREE.SphereGeometry(120,24,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.BackSide,fog:false,depthWrite:false,toneMapped:false}));

  const a=rnd(0,6.283),d=6+Math.sqrt(Math.random())*70,x=Math.cos(a)*d,z=Math.sin(a)*d,s=rnd(.8,1.5);

}

}

const NF=350,iF=new THREE.InstancedMesh(new THREE.SphereGeometry(.09,5,4),new THREE.MeshLambertMaterial({color:0xffffff}),NF),pal=[0xffffff,0xffd23f,0xff6b9a,0xb28dff];
for(let i=0;i<NF;i++){const a=rnd(0,6.283),d=3+Math.sqrt(Math.random())*72;dm.position.set(Math.cos(a)*d,.32,Math.sin(a)*d);dm.rotation.set(0,0,0);dm.scale.setScalar(rnd(.8,1.3));dm.updateMatrix();iF.setMatrixAt(i,dm.matrix);iF.setColorAt(i,cl.setHex(pal[i%4]))}

const G=1.5,KMAX=4,blocks=new Map(),bkey=(i,j,k)=>i+","+j+","+k;
function btex(col,wood){const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");x.fillStyle=col;x.fillRect(0,0,64,64);
  for(let i=0;i<70;i++){x.fillStyle="rgba(0,0,0,"+(Math.random()*.18)+")";x.fillRect(Math.random()*64,Math.random()*64,rnd(2,12),rnd(1,3))}
  x.strokeStyle="rgba(0,0,0,.45)";x.lineWidth=3;x.strokeRect(1,1,62,62);if(wood){x.beginPath();x.moveTo(0,32);x.lineTo(64,32);x.stroke()}
  return new THREE.CanvasTexture(c)}
const BT=[
 {n:"Legno",c:1,hp:100,m:new THREE.MeshLambertMaterial({map:btex("#9c6b3a",1)}),p:new THREE.MeshBasicMaterial({color:0x9c6b3a})},
 {n:"Pietra",c:2,hp:300,m:new THREE.MeshLambertMaterial({map:btex("#8d9096",0)}),p:new THREE.MeshBasicMaterial({color:0x8d9096})}
];
const bGeo=new THREE.BoxGeometry(G,G,G);

function addBlock(i,j,k,t){const b={i,j,k,t,hp:BT[t].hp,max:BT[t].hp,mesh:new THREE.Mesh(bGeo,BT[t].m)};
  b.mesh.position.set((i+.5)*G,(k+.5)*G,(j+.5)*G);b.mesh.castShadow=b.mesh.receiveShadow=true;b.mesh.userData.blk=b;scene.add(b.mesh);blocks.set(bkey(i,j,k),b);return b}

function circleHit(x,z,r,y0,y1){
  if(!blocks.size)return null;
  for(let i=Math.floor((x-r)/G);i<=Math.floor((x+r)/G);i++)for(let j=Math.floor((z-r)/G);j<=Math.floor((z+r)/G);j++){
    const nx=Math.max(i*G,Math.min(x,(i+1)*G)),nz=Math.max(j*G,Math.min(z,(j+1)*G));
    if((x-nx)*(x-nx)+(z-nz)*(z-nz)>=r*r)continue;
    for(let k=0;k<KMAX;k++){const b=blocks.get(bkey(i,j,k));if(b&&(k+1)*G>y0&&k*G<y1)return b}
  }
  return null}

  if(!blocks.size)return 0;let h=0;
  for(let i=Math.floor((x-r)/G);i<=Math.floor((x+r)/G);i++)for(let j=Math.floor((z-r)/G);j<=Math.floor((z+r)/G);j++)
    for(let k=0;k<KMAX;k++){if(blocks.get(bkey(i,j,k))&&(k+1)*G<=y+.45&&(k+1)*G>h)h=(k+1)*G}
  return h}

  if(!blocks.size)return false;const n=Math.ceil(Math.hypot(x1-x0,z1-z0)/.4);
  for(let i=1;i<n;i++){const t=i/n;if(circleHit(x0+(x1-x0)*t,z0+(z1-z0)*t,.05,py+.4,py+1.7))return true}
  return false}
const bray=new THREE.Raycaster(),gpl=new THREE.Plane(new THREE.Vector3(0,1,0),0),gpt=new THREE.Vector3();

  let gd=Infinity;if(bray.ray.intersectPlane(gpl,gpt))gd=gpt.distanceTo(bray.ray.origin);

    if(keys.Space&&onG){vy=9;onG=false}
    const pyOld=py;vy-=24*dt;
    if(vy>0&&circleHit(nx,nz,.35,py+1.6,py+1.75+vy*dt))vy=0;
    py+=vy*dt;
    const sh=supportH(nx,nz,.3,pyOld);
    if(py<=sh){py=sh;vy=0;onG=true}else onG=false;
    cam.position.y=py+1.7+((fx||sx)&&onG?Math.sin(T*10)*.04:0);mv=(fx||sx)?1:0;
    cam.rotation.y=yaw;cam.rotation.x=pitch;
    if(keys.fire&&!build)shoot(now);
    // Dinosauri
    for(const m of monkeys){
      const p=m.g.position,k=m.k;
      if(m.dead){
        m.dead+=dt*k.dd;
        if(k.fly){p.y=Math.max(.2,p.y-dt*14);m.g.rotation.z+=dt*6}else m.g.rotation.z=Math.min(m.dead,1.5);
        if(m.dead>3){scene.remove(m.g);m.gone=1}continue;
      }
      const ex=cam.position.x-p.x,ez=cam.position.z-p.z,d=Math.hypot(ex,ez),att=d<=k.rng&&(k.fly||(py<=k.reach&&!segBlocked(p.x,p.z,cam.position.x,cam.position.z)));
      m.g.rotation.y=Math.atan2(ex,ez);
      if(k.fly){
        m.w+=dt;m.t+=dt*(att?10:14);
        p.y+=(1.9+Math.min(d,30)*.22+Math.sin(m.w*1.5+m.ph)*1.1-p.y)*Math.min(1,dt*2);
        m.wings.forEach(w=>w.rotation.z=Math.sin(m.t)*.8*w.userData.s);
      }
      if(!att){
        const iv=d>.3?1/d:0,ox=p.x,oz=p.z;let nx=ox+ex*iv*m.speed*dt,nz=oz+ez*iv*m.speed*dt,hb=null;
        if(!k.fly&&blocks.size){const b1=circleHit(nx,oz,k.r,0,k.h),b2=circleHit(ox,nz,k.r,0,k.h);if(b1){nx=ox;hb=b1}if(b2){nz=oz;hb=hb||b2}}
        const prog=Math.hypot(nx-ox,nz-oz);p.x=nx;p.z=nz;m.g.rotation.x=0;
        if(hb&&prog<m.speed*dt*.5){m.bc-=dt;m.g.rotation.x=.3*Math.max(0,Math.sin(T*9));if(m.bc<=0){m.bc=k.cd;damageBlock(hb,k.dmg*2+wave*2)}}
        if(!k.fly){
          m.t+=dt*m.speed*k.st;p.y=Math.abs(Math.sin(m.t))*k.bob;
          m.legs.forEach(l=>l.rotation.x=Math.sin(m.t+l.userData.ph*Math.PI)*k.amp);
          m.arms.forEach(a=>a.rotation.x=.8+Math.sin(m.t*2)*.2);
        }
      }else{
        m.cd-=dt;m.g.rotation.x=.3*Math.max(0,Math.sin(T*9));
        if(!k.fly){p.y=0;m.arms.forEach(a=>a.rotation.x=1.4)}
        if(m.cd<=0){m.cd=k.cd;hp-=Math.round(k.dmg+wave*k.dw);hurt=1;beep(70,.25,"sawtooth",.14);updHud();if(hp<=0)gameOver()}
      }
    }
    for(let i=monkeys.length-1;i>=0;i--)if(monkeys[i].gone)monkeys.splice(i,1);
    if(alive&&!build&&!monkeys.some(m=>!m.dead)){
      waveTimer+=dt;if(waveTimer>0.1&&waveTimer<.2)banner("Ondata superata!",2200);
      if(waveTimer>3){waveTimer=0;if(wave%3===0)startBuild();else spawnWave()}
    }
    if(build){
      buildT-=dt;
      if(buildT<=0)endBuild();
      else{
        const tg=target();let ok=false;
        if(tg&&canPlace(tg)){ok=true;ghost.position.set((tg.i+.5)*G,(tg.k+.5)*G,(tg.j+.5)*G)}
        ghost.visible=ok;
        $("buildp").innerHTML="🏗 FASE COSTRUZIONE · <span style='color:var(--accent)'>"+Math.ceil(buildT)+"s</span> · Blocchi: <b>"+supplies+"</b><br>[1] Legno (1) · [2] Pietra (2) → <b>"+BT[btype].n+"</b><br>Click: piazza · Click destro: rimuovi · Spazio: salta · INVIO: inizia l'ondata";
      }
    }
    $("left").textContent="Nemici: "+monkeys.filter(m=>!m.dead).length;
  }
  recoil=Math.max(0,recoil-dt*8);
  aimT+=((keys.aim?1:0)-aimT)*Math.min(1,dt*12);
  const gy=gun.userData.sy||.05;
  reloadT+=((reloading?1:0)-reloadT)*Math.min(1,dt*6);swT=Math.max(0,swT-dt*4);
  const bobx=Math.sin(T*5)*.006*mv*(1-aimT),boby=Math.abs(Math.sin(T*10))*.008*mv*(1-aimT);
  gun.position.set(.28*(1-aimT)+bobx,-.26*(1-aimT)-gy*aimT-boby-.2*reloadT-.4*swT,-.5+recoil*.08+.05*reloadT);
  gun.rotation.set(recoil*.1+.5*reloadT,0,-.35*reloadT);
  gun.visible=!build&&!(cur===3&&aimT>.5);$("scope").style.opacity=cur===3?Math.max(0,(aimT-.5)*2):0;
  const pm=gun.userData.pump;if(pm){pumpT=Math.min(1,pumpT+dt*2.2);pm.position.z=pm.userData.z0+.12*Math.sin(Math.PI*pumpT)}
  cam.fov=75-(75-W[cur].fov)*aimT;cam.updateProjectionMatrix();
  hitT=Math.max(0,hitT-dt);
  skyG.position.copy(cam.position);cloudG.rotation.y+=dt*.008;
  sun.position.copy(cam.position).add(SO);sun.target.position.copy(cam.position);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i],v=q.userData.v;v.y-=12*dt;q.position.addScaledVector(v,dt);if(q.position.y<.03){q.position.y=.03;v.set(0,0,0)}if((q.userData.l-=dt)<=0){scene.remove(q);parts.splice(i,1)}}
  $("cross").style.borderColor=hitT>0?"#f33":aimT>.5?"transparent":"#fff";
  for(const m of monkeys)if(!m.dead)m.bar.lookAt(cam.position);
  hurt=Math.max(0,hurt-dt*2);$("dmg").style.opacity=hurt;
  R.render(scene,cam);
}
loop();
</script></body></html>
